version: 2

project_name: address-serv

before:
  hooks:
    # The web UI is embedded into the binary (frontend/embed.go).
    - npm --prefix frontend ci
    - npm --prefix frontend run build

builds:
  - id: address-serv
    binary: address-serv
    main: ./cmd/address-serv
    env:
      - CGO_ENABLED=0
    # Collectors need Unix process groups, so there is no Windows build.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.branch={{ .Branch }}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore", "^style"]
