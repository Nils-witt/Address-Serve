services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LISTEN_ADDR: ${LISTEN_ADDR}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-}
      # The binary is /address-serv, so its collectors folder is /collectors.
      COLLECTOR_ADMIN_GROUP: ${COLLECTOR_ADMIN_GROUP:-}
      COLLECTOR_TIMEOUT: ${COLLECTOR_TIMEOUT:-10m}
      COLLECTOR_GEO_MAX_DISTANCE_M: ${COLLECTOR_GEO_MAX_DISTANCE_M:-100}
      COLLECTOR_RUN_HISTORY: ${COLLECTOR_RUN_HISTORY:-50}
      # Time zone of collector schedules without a CRON_TZ= prefix.
      TZ: ${TZ:-}
    volumes:
      # The image has no shell or interpreters: collectors must be static
      # binaries.
      - ./collectors:/collectors:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
