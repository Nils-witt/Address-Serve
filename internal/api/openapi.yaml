openapi: 3.0.3
info:
  title: address-serv API
  description: >-
    API for managing Street and HouseNumber entities. Every endpoint requires
    a bearer token except the API docs (/docs) and the web UI configuration
    (/ui-config).
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: health
  - name: streets
  - name: house-numbers
  - name: bulk
  - name: api-tokens
  - name: ui
  - name: docs

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Service is healthy
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /docs:
    get:
      summary: API documentation (Swagger UI)
      description: Public (no token required).
      operationId: getDocs
      tags: [docs]
      security: []
      responses:
        "200":
          description: Swagger UI page rendering this spec
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Public (no token required).
      operationId: getOpenAPISpec
      tags: [docs]
      security: []
      responses:
        "200":
          description: This OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /ui-config:
    get:
      summary: Web UI configuration
      description: >-
        Public (no token required). Tells the web UI served at /ui/ which
        OpenID Connect client to sign in with, and which build it talks to.
      operationId: getUIConfig
      tags: [ui]
      security: []
      responses:
        "200":
          description: The UI configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIConfig"

  /api/streets:
    get:
      summary: List streets
      description: Optionally filter by city, district, country and/or name. city, district and country match exactly (case-insensitive); name matches as a substring (case-insensitive).
      operationId: listStreets
      tags: [streets]
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact city (case-insensitive)
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact district (case-insensitive)
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact country (case-insensitive)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter streets whose name contains this substring (case-insensitive)
      responses:
        "200":
          description: A list of streets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Street"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a street
      operationId: createStreet
      tags: [streets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "201":
          description: The created street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cities:
    get:
      summary: List distinct cities
      description: Optionally filter by name (substring, case-insensitive).
      operationId: listCities
      tags: [streets]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter cities whose name contains this substring (case-insensitive)
      responses:
        "200":
          description: A list of distinct city names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [Bonn, Berlin]
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/districts:
    get:
      summary: List distinct districts
      description: Optionally filter by name (substring, case-insensitive) and/or city (exact, case-insensitive).
      operationId: listDistricts
      tags: [streets]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter districts whose name contains this substring (case-insensitive)
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter districts belonging to this exact city (case-insensitive)
      responses:
        "200":
          description: A list of distinct districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/streets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Street ID

    get:
      summary: Get a street by ID
      operationId: getStreet
      tags: [streets]
      responses:
        "200":
          description: The requested street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a street
      operationId: updateStreet
      tags: [streets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "200":
          description: The updated street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a street
      operationId: deleteStreet
      tags: [streets]
      responses:
        "204":
          description: Street deleted
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/bulk:
    post:
      summary: Bulk create streets and house numbers
      description: >-
        Creates one or more streets together with their house numbers in a single
        request. The whole batch is applied atomically: if any street or house
        number fails to create (e.g. a duplicate street, or a validation error),
        nothing in the request is persisted.
      operationId: bulkCreate
      tags: [bulk]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/BulkStreetInput"
      responses:
        "201":
          description: The created streets and house numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/house-numbers:
    get:
      summary: List house numbers
      description: Optionally filter by street and/or number.
      operationId: listHouseNumbers
      tags: [house-numbers]
      parameters:
        - name: streetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter house numbers belonging to this street
        - name: number
          in: query
          required: false
          schema:
            type: integer
          description: Filter house numbers with this exact number
      responses:
        "200":
          description: A list of house numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid streetId or number query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a house number
      operationId: createHouseNumber
      tags: [house-numbers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseNumberInput"
      responses:
        "201":
          description: The created house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid request body, or streetId does not reference an existing street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/house-numbers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: HouseNumber ID

    get:
      summary: Get a house number by ID
      operationId: getHouseNumber
      tags: [house-numbers]
      responses:
        "200":
          description: The requested house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a house number
      operationId: updateHouseNumber
      tags: [house-numbers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseNumberInput"
      responses:
        "200":
          description: The updated house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid ID or request body, or streetId does not reference an existing street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a house number
      operationId: deleteHouseNumber
      tags: [house-numbers]
      responses:
        "204":
          description: House number deleted
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens:
    get:
      summary: List your API tokens
      description: >-
        Lists the API tokens owned by the signed-in user, newest first. The
        secrets are never returned again after creation. Requires an OIDC
        token; API tokens can't manage API tokens.
      operationId: listAPITokens
      tags: [api-tokens]
      responses:
        "200":
          description: The user's API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create an API token
      description: >-
        Creates an API token owned by the signed-in user. The response is the
        only time the secret is shown. Requires an OIDC token; API tokens
        can't manage API tokens.
      operationId: createAPIToken
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: The created token, including its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Revoke an API token
      description: Deletes one of the signed-in user's API tokens; it stops working immediately.
      operationId: deleteAPIToken
      tags: [api-tokens]
      responses:
        "204":
          description: Token revoked
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No API token with this ID belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Send as `Authorization: Bearer <token>`. The token is either a JWT
        issued by the configured OpenID Connect provider, checked against the
        provider's JWKS, issuer and audience, or an API token (starting with
        `asv_`) created at /api/tokens.

  schemas:
    District:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          example: Mitte
        city:
          type: string
          example: Berlin

    StreetInput:
      type: object
      required: [city, district, name, country, latitude, longitude]
      properties:
        city:
          type: string
          example: Berlin
        district:
          type: string
          example: Mitte
        name:
          type: string
          example: Alexanderplatz
        country:
          type: string
          example: Germany
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5219
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4132

    Street:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: db94a625-aa11-4c37-b9ff-9706e792e7dd
        - $ref: "#/components/schemas/StreetInput"

    HouseNumberInput:
      type: object
      required: [streetId, number, postcode, latitude, longitude]
      properties:
        streetId:
          type: string
          format: uuid
          description: ID of the referenced Street entity
          example: db94a625-aa11-4c37-b9ff-9706e792e7dd
        number:
          type: integer
          minimum: 1
          example: 12
        numberAddition:
          type: string
          nullable: true
          description: Optional suffix, e.g. "a" or "b"
          example: a
        postcode:
          type: string
          example: "10178"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5210
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4130

    HouseNumber:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: 094d22c5-9ec0-4917-b2b2-b82a5a89523d
        - $ref: "#/components/schemas/HouseNumberInput"

    BulkHouseNumberInput:
      type: object
      required: [number, postcode, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          example: 12
        numberAddition:
          type: string
          nullable: true
          description: Optional suffix, e.g. "a" or "b"
          example: a
        postcode:
          type: string
          example: "10178"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5210
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4130

    BulkStreetInput:
      type: object
      required: [city, district, name, country, latitude, longitude]
      properties:
        city:
          type: string
          example: Berlin
        district:
          type: string
          example: Mitte
        name:
          type: string
          example: Alexanderplatz
        country:
          type: string
          example: Germany
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5219
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4132
        houseNumbers:
          type: array
          items:
            $ref: "#/components/schemas/BulkHouseNumberInput"

    BulkResult:
      type: object
      required: [street, houseNumbers]
      properties:
        street:
          $ref: "#/components/schemas/Street"
        houseNumbers:
          type: array
          items:
            $ref: "#/components/schemas/HouseNumber"

    APITokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: What the token is for, to recognise it later
          example: import script
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; must be in the future. Omit or null for no expiry.
          example: "2027-01-01T00:00:00Z"

    APIToken:
      type: object
      required: [id, name, prefix, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 5f0e6d0b-3c39-4a4e-9a55-0f3c8a1c2b7d
        name:
          type: string
          example: import script
        prefix:
          type: string
          description: The first characters of the secret, to tell tokens apart
          example: asv_Xk3v9QaZ
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Approximate (recorded at most once a minute)

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. Shown only in this response.
              example: asv_Xk3v9QaZ7m2b0VqYw1sN4eLr8tHcJpGdUfKiAoBxE5y

    UIConfig:
      type: object
      required: [oidc, version, commit, branch]
      properties:
        oidc:
          type: object
          required: [issuer, clientId, scope]
          properties:
            issuer:
              type: string
              example: https://auth.example.com/realms/example
            clientId:
              type: string
              example: address-serv
            scope:
              type: string
              example: openid profile email
        version:
          type: string
          example: v1.2.0
        commit:
          type: string
          example: 39e8906
        branch:
          type: string
          description: Git branch the build was made from; empty when unknown.
          example: main

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: street not found
