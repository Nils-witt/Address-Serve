openapi: 3.0.3
info:
  title: address-serv API
  description: >-
    API for managing Street, HouseNumber and GeoObject entities. Every endpoint requires
    a bearer token except the API docs (/docs) and the web UI configuration
    (/ui-config).
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: health
  - name: streets
  - name: house-numbers
  - name: geo-objects
  - name: geocoding
  - name: bulk
  - name: api-tokens
  - name: collectors
  - name: ui
  - name: docs

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Service is healthy
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /docs:
    get:
      summary: API documentation (Swagger UI)
      description: Public (no token required).
      operationId: getDocs
      tags: [docs]
      security: []
      responses:
        "200":
          description: Swagger UI page rendering this spec
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Public (no token required).
      operationId: getOpenAPISpec
      tags: [docs]
      security: []
      responses:
        "200":
          description: This OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /ui-config:
    get:
      summary: Web UI configuration
      description: >-
        Public (no token required). Tells the web UI served at /ui/ which
        OpenID Connect client to sign in with, and which build it talks to.
      operationId: getUIConfig
      tags: [ui]
      security: []
      responses:
        "200":
          description: The UI configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIConfig"

  /api/streets:
    get:
      summary: List streets
      description: Optionally filter by city, district, country and/or name. city, district and country match exactly (case-insensitive); name matches as a substring (case-insensitive).
      operationId: listStreets
      tags: [streets]
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact city (case-insensitive)
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact district (case-insensitive)
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Filter streets with this exact country (case-insensitive)
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter streets whose name contains this substring (case-insensitive)
      responses:
        "200":
          description: A list of streets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Street"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a street
      operationId: createStreet
      tags: [streets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "201":
          description: The created street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cities:
    get:
      summary: List distinct cities
      description: Optionally filter by name (substring, case-insensitive).
      operationId: listCities
      tags: [streets]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter cities whose name contains this substring (case-insensitive)
      responses:
        "200":
          description: A list of distinct city names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [Bonn, Berlin]
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/districts:
    get:
      summary: List distinct districts
      description: Optionally filter by name (substring, case-insensitive) and/or city (exact, case-insensitive).
      operationId: listDistricts
      tags: [streets]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter districts whose name contains this substring (case-insensitive)
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter districts belonging to this exact city (case-insensitive)
      responses:
        "200":
          description: A list of distinct districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/District"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/streets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Street ID

    get:
      summary: Get a street by ID
      operationId: getStreet
      tags: [streets]
      responses:
        "200":
          description: The requested street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a street
      operationId: updateStreet
      tags: [streets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreetInput"
      responses:
        "200":
          description: The updated street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Street"
        "400":
          description: Invalid ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists, or a collector owns the street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a street
      operationId: deleteStreet
      tags: [streets]
      responses:
        "204":
          description: Street deleted
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Street not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused because a collector owns the street, or rows of a collector are on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/bulk:
    post:
      summary: Bulk create streets and house numbers
      description: >-
        Creates one or more streets together with their house numbers in a single
        request. The whole batch is applied atomically: if any street or house
        number fails to create (e.g. a duplicate street, or a validation error),
        nothing in the request is persisted. A street's house numbers must be
        unique by number and addition.
      operationId: bulkCreate
      tags: [bulk]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/BulkStreetInput"
      responses:
        "201":
          description: The created streets and house numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A street with this name, district, city and country already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/house-numbers:
    get:
      summary: List house numbers
      description: >-
        Optionally filter by street, number, postcode, street name, city,
        district and/or country. Filters combine with AND. postcode matches
        as a prefix and street as a substring; city, district and country
        match exactly. All text filters are case-insensitive.
      operationId: listHouseNumbers
      tags: [house-numbers]
      parameters:
        - name: streetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter house numbers belonging to this street
        - name: number
          in: query
          required: false
          schema:
            type: integer
          description: Filter house numbers with this exact number
        - name: postcode
          in: query
          required: false
          schema:
            type: string
          description: Filter house numbers whose postcode starts with this prefix (case-insensitive)
        - name: street
          in: query
          required: false
          schema:
            type: string
          description: Filter house numbers whose street name contains this substring (case-insensitive)
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter house numbers on streets in this exact city (case-insensitive)
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: Filter house numbers on streets in this exact district (case-insensitive)
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: Filter house numbers on streets in this exact country (case-insensitive)
      responses:
        "200":
          description: A list of house numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid streetId or number query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a house number
      operationId: createHouseNumber
      tags: [house-numbers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseNumberInput"
      responses:
        "201":
          description: The created house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid request body, or streetId does not reference an existing street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The street already has a house number with this number and addition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/house-numbers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: HouseNumber ID

    get:
      summary: Get a house number by ID
      operationId: getHouseNumber
      tags: [house-numbers]
      responses:
        "200":
          description: The requested house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a house number
      operationId: updateHouseNumber
      tags: [house-numbers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseNumberInput"
      responses:
        "200":
          description: The updated house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseNumber"
        "400":
          description: Invalid ID or request body, or streetId does not reference an existing street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The street already has a house number with this number and addition, or a collector owns the house number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a house number
      operationId: deleteHouseNumber
      tags: [house-numbers]
      responses:
        "204":
          description: House number deleted
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: House number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused because a collector owns the house number, or geo objects of a collector point to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/geo-objects:
    get:
      summary: List geo objects
      description: >-
        Optionally filter by name, group, street and/or house number. Filters
        combine with AND. name matches as a substring and group exactly, both
        case-insensitively.
      operationId: listGeoObjects
      tags: [geo-objects]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter geo objects whose name contains this substring (case-insensitive)
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: Filter geo objects in this exact group (case-insensitive)
        - name: streetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter geo objects on this street
        - name: houseNumberId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter geo objects at this house number
        - name: externalId
          in: query
          required: false
          schema:
            type: string
          description: Filter the geo object with this exact external ID (case-sensitive)
        - name: externalIdPrefix
          in: query
          required: false
          schema:
            type: string
          description: Filter geo objects whose external ID starts with this prefix (case-sensitive)
      responses:
        "200":
          description: A list of geo objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeoObject"
        "400":
          description: Invalid streetId or houseNumberId query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a geo object
      operationId: createGeoObject
      tags: [geo-objects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectInput"
      responses:
        "201":
          description: The created geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "409":
          description: name is already used by another geo object in the same group, or externalId is already used by another geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid request body, or streetId does not reference an existing street, houseNumberId does not reference an existing house number, or the house number is not on that street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/geo-objects/bulk-delete:
    post:
      summary: Delete many geo objects
      description: >-
        Deletes every geo object named by ID or by external ID in a single
        statement. Names that match no geo object are skipped, so the request
        can be repeated safely. At most 10000 IDs and external IDs together.
      operationId: bulkDeleteGeoObjects
      tags: [geo-objects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectRefs"
      responses:
        "200":
          description: How many geo objects were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"
        "400":
          description: Invalid request body, no IDs given, or too many IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused because a collector owns some of the geo objects; nothing is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/geo-objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: GeoObject ID

    get:
      summary: Get a geo object by ID
      operationId: getGeoObject
      tags: [geo-objects]
      responses:
        "200":
          description: The requested geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Geo object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Update a geo object
      description: Replaces the geo object. An omitted externalId keeps the stored one.
      operationId: updateGeoObject
      tags: [geo-objects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectInput"
      responses:
        "200":
          description: The updated geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "409":
          description: name is already used by another geo object in the same group, or externalId is already used by another geo object, or a collector owns the geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid ID or request body, or streetId does not reference an existing street, houseNumberId does not reference an existing house number, or the house number is not on that street
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Geo object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a geo object
      operationId: deleteGeoObject
      tags: [geo-objects]
      responses:
        "204":
          description: Geo object deleted
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Geo object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused because a collector owns the geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/geo-objects/by-external-id/{externalId}:
    parameters:
      - name: externalId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: The geo object's external ID, set by the system that syncs it

    put:
      summary: Create or replace a geo object by external ID
      description: >-
        Creates the geo object with this external ID, or replaces it if it
        exists, keeping its ID. The path value overrides any externalId in the
        body. Meant for systems such as tileserve-go that keep their objects in
        sync.
      operationId: upsertGeoObjectByExternalId
      tags: [geo-objects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoObjectInput"
      responses:
        "200":
          description: The replaced geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "201":
          description: The created geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoObject"
        "409":
          description: name is already used by another geo object in the same group, or a collector owns the geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid external ID or request body, or invalid street or house number reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a geo object by external ID
      operationId: deleteGeoObjectByExternalId
      tags: [geo-objects]
      responses:
        "204":
          description: Geo object deleted
        "400":
          description: Invalid external ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Geo object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Refused because a collector owns the geo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/addresses/search:
    get:
      summary: Search addresses
      description: >-
        Free-text address search for autocompletion. A trailing number in q is
        matched as a house number prefix ("Hauptstraße 1" finds 1, 10, 12, ...);
        the rest matches street names as a case-insensitive substring. Each
        result is a street with one of its house numbers, or the street alone
        if it has none.
      operationId: searchAddresses
      tags: [streets]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Street name, optionally followed by a house number; the street part needs at least 2 characters
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Matching addresses, ordered by street name, city, district and house number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressMatch"
        "400":
          description: q too short or limit out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reverse:
    get:
      summary: Reverse geocode a coordinate
      description: >-
        Returns the house numbers and the geo objects nearest to the given
        coordinate as two lists, each nearest first and ranked by its own
        great-circle distance in meters. A geo object's distance is measured
        to its own coordinates, not its street's or house number's. By default
        only the nearest of each is returned; set limit to get the n nearest
        of each. Both lists are always present, empty if nothing is stored.
      operationId: reverseGeocode
      tags: [geocoding]
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 50.7341
          description: Latitude of the query point
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 7.0982
          description: Longitude of the query point
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
          description: Number of nearest house numbers, and of nearest geo objects, to return
      responses:
        "200":
          description: The nearest house numbers and geo objects, each nearest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResult"
        "400":
          description: Missing or invalid lat, lon or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens:
    get:
      summary: List your API tokens
      description: >-
        Lists the API tokens owned by the signed-in user, newest first. The
        secrets are never returned again after creation. Requires an OIDC
        token; API tokens can't manage API tokens.
      operationId: listAPITokens
      tags: [api-tokens]
      responses:
        "200":
          description: The user's API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create an API token
      description: >-
        Creates an API token owned by the signed-in user. The response is the
        only time the secret is shown. Requires an OIDC token; API tokens
        can't manage API tokens.
      operationId: createAPIToken
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: The created token, including its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Revoke an API token
      description: Deletes one of the signed-in user's API tokens; it stops working immediately.
      operationId: deleteAPIToken
      tags: [api-tokens]
      responses:
        "204":
          description: Token revoked
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request was authenticated with an API token, or the OIDC token has no subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No API token with this ID belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/collectors:
    get:
      summary: List collectors
      description: >-
        Lists every collector found in the collectors folder, including missing
        and invalid ones, each with its last run. Requires membership in
        the group COLLECTOR_ADMIN_GROUP names, as listed in the OIDC token's
        groups claim; API tokens are rejected.
      operationId: listCollectors
      tags: [collectors]
      responses:
        "200":
          description: The collectors, ordered by ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collector"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"

  /api/collectors/reload:
    post:
      summary: Rescan the collectors folder
      description: >-
        Rescans the collectors folder and runs `describe` on each executable.
        Collectors that are no longer there are marked missing; their settings
        and rows are kept.
      operationId: reloadCollectors
      tags: [collectors]
      responses:
        "200":
          description: Every known collector after the scan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collector"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"

  /api/collectors/{id}:
    parameters:
      - $ref: "#/components/parameters/CollectorID"
    get:
      summary: Get a collector
      operationId: getCollector
      tags: [collectors]
      responses:
        "200":
          description: The collector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collector"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a missing or invalid collector
      description: >-
        Deletes the collector and its runs. Its rows become manual ones, unless
        deleteData is set: then they are deleted, except rows that others
        depend on, which become manual.
      operationId: deleteCollector
      tags: [collectors]
      parameters:
        - name: deleteData
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Collector deleted
        "400":
          description: Invalid deleteData
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The collector is still available (status ok), or it is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/collectors/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/CollectorID"
    put:
      summary: Replace a collector's settings
      description: >-
        Replaces the settings with the given object, keyed by setting key and
        validated against the collector's settings schema. Absent settings are
        unset, except secrets, which keep their value; null unsets a secret.
      operationId: updateCollectorSettings
      tags: [collectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              source_url: https://example.com/addresses.json
              api_key: s3cret
      responses:
        "200":
          description: The collector with its new settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collector"
        "400":
          description: The body is not an object, or a setting is unknown or has the wrong type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/collectors/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/CollectorID"
    get:
      summary: List a collector's runs
      description: Lists the runs, newest first, without their issues and logs.
      operationId: listCollectorRuns
      tags: [collectors]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectorRun"
        "400":
          description: Invalid limit or offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Start a run
      description: >-
        Starts the collector in the background and returns the running run.
        Poll the run to follow it.
      operationId: startCollectorRun
      tags: [collectors]
      responses:
        "202":
          description: The started run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRun"
        "400":
          description: Required settings have no value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The collector is missing or invalid, or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/collector-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      summary: Get a run
      description: Returns the run with its issues and log.
      operationId: getCollectorRun
      tags: [collectors]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectorRun"
        "400":
          description: Invalid run ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/collector-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      summary: Cancel a run
      description: >-
        Kills the collector process, or rolls back its sync. The run ends as
        cancelled and nothing is applied.
      operationId: cancelCollectorRun
      tags: [collectors]
      responses:
        "202":
          description: Cancellation requested
        "400":
          description: Invalid run ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CollectorForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    CollectorID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Collector ID, its filename up to the first dot
      example: bonn
    RunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CollectorForbidden:
      description: >-
        Collector management is disabled, the request used an API token, or
        the user isn't in the admin group
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Send as `Authorization: Bearer <token>`. The token is either a JWT
        issued by the configured OpenID Connect provider, checked against the
        provider's JWKS, issuer and audience, or an API token (starting with
        `asv_`) created at /api/tokens.

  schemas:
    District:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          example: Mitte
        city:
          type: string
          example: Berlin

    StreetInput:
      type: object
      required: [city, district, name, country, latitude, longitude]
      properties:
        city:
          type: string
          example: Berlin
        district:
          type: string
          example: Mitte
        name:
          type: string
          example: Alexanderplatz
        country:
          type: string
          example: Germany
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5219
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4132

    Street:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: db94a625-aa11-4c37-b9ff-9706e792e7dd
            collectorId:
              type: string
              readOnly: true
              description: >-
                The collector that owns this row, if any. Rows owned by a
                collector are changed only by its runs.
              example: bonn
            externalId:
              type: string
              readOnly: true
              description: The row's stable ID in its collector's source, if any. Only collectors set it.
              example: bonn-0815
        - $ref: "#/components/schemas/StreetInput"

    HouseNumberInput:
      type: object
      required: [streetId, number, postcode, latitude, longitude]
      properties:
        streetId:
          type: string
          format: uuid
          description: ID of the referenced Street entity
          example: db94a625-aa11-4c37-b9ff-9706e792e7dd
        number:
          type: integer
          minimum: 1
          example: 12
        numberAddition:
          type: string
          nullable: true
          description: Optional suffix, e.g. "a" or "b"
          example: a
        postcode:
          type: string
          example: "10178"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5210
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4130

    HouseNumber:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: 094d22c5-9ec0-4917-b2b2-b82a5a89523d
            collectorId:
              type: string
              readOnly: true
              description: >-
                The collector that owns this row, if any. Rows owned by a
                collector are changed only by its runs.
              example: bonn
            externalId:
              type: string
              readOnly: true
              description: The row's stable ID in its collector's source, if any. Only collectors set it.
              example: bonn-0815
        - $ref: "#/components/schemas/HouseNumberInput"

    NearbyHouseNumber:
      type: object
      required: [houseNumber, street, distanceMeters]
      properties:
        houseNumber:
          $ref: "#/components/schemas/HouseNumber"
        street:
          $ref: "#/components/schemas/Street"
        distanceMeters:
          type: number
          format: double
          description: Great-circle distance from the query point in meters
          example: 12.4

    NearbyGeoObject:
      type: object
      required: [geoObject, street, distanceMeters]
      properties:
        geoObject:
          $ref: "#/components/schemas/GeoObject"
        street:
          $ref: "#/components/schemas/Street"
        houseNumber:
          allOf:
            - $ref: "#/components/schemas/HouseNumber"
          description: The geo object's house number; omitted if it has none
        distanceMeters:
          type: number
          format: double
          description: Great-circle distance from the query point to the geo object in meters
          example: 8.3

    ReverseGeocodeResult:
      type: object
      required: [houseNumbers, geoObjects]
      properties:
        houseNumbers:
          type: array
          description: The nearest house numbers, nearest first
          items:
            $ref: "#/components/schemas/NearbyHouseNumber"
        geoObjects:
          type: array
          description: The nearest geo objects, nearest first
          items:
            $ref: "#/components/schemas/NearbyGeoObject"

    GeoObjectInput:
      type: object
      required: [name, group, streetId, latitude, longitude]
      properties:
        name:
          type: string
          description: Unique within the group
          example: Hydrant 12
        group:
          type: string
          example: hydrants
        streetId:
          type: string
          format: uuid
          description: >-
            ID of the referenced Street entity. Deleting the street deletes
            its geo objects.
          example: db94a625-aa11-4c37-b9ff-9706e792e7dd
        houseNumberId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional ID of a HouseNumber on the referenced street. Deleting the
            house number clears this field and keeps the geo object.
          example: 094d22c5-9ec0-4917-b2b2-b82a5a89523d
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: The geo object's own position, independent of the street and house number
          example: 52.5212
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4135
        externalId:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: >-
            Optional ID of the object in another system that keeps it in sync,
            such as tileserve-go. Unique across geo objects.
          example: tileserve:6f1c2d3e-0000-4000-8000-000000000000:5b0f3c1e-8f2a-4a8e-9a43-2f1d6c7b9e10

    AddressMatch:
      type: object
      required: [streetId, street, city, district, country, latitude, longitude]
      properties:
        streetId:
          type: string
          format: uuid
        houseNumberId:
          type: string
          format: uuid
        street:
          type: string
          example: Hauptstraße
        houseNumber:
          type: integer
          example: 12
        numberAddition:
          type: string
          example: a
        postcode:
          type: string
          example: "53111"
        city:
          type: string
        district:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
          description: The house number's position, or the street's when there is none
        longitude:
          type: number
          format: double

    GeoObject:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              example: 5b0f3c1e-8f2a-4a8e-9a43-2f1d6c7b9e10
            collectorId:
              type: string
              readOnly: true
              description: >-
                The collector that owns this row, if any. Rows owned by a
                collector are changed only by its runs.
              example: bonn
        - $ref: "#/components/schemas/GeoObjectInput"

    GeoObjectRefs:
      type: object
      description: Geo objects named by ID, by external ID, or both. At least one entry is required.
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        externalIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255

    BulkDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64
          description: Number of geo objects deleted

    BulkHouseNumberInput:
      type: object
      required: [number, postcode, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          example: 12
        numberAddition:
          type: string
          nullable: true
          description: Optional suffix, e.g. "a" or "b"
          example: a
        postcode:
          type: string
          example: "10178"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5210
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4130

    BulkStreetInput:
      type: object
      required: [city, district, name, country, latitude, longitude]
      properties:
        city:
          type: string
          example: Berlin
        district:
          type: string
          example: Mitte
        name:
          type: string
          example: Alexanderplatz
        country:
          type: string
          example: Germany
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 52.5219
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 13.4132
        houseNumbers:
          type: array
          items:
            $ref: "#/components/schemas/BulkHouseNumberInput"

    BulkResult:
      type: object
      required: [street, houseNumbers]
      properties:
        street:
          $ref: "#/components/schemas/Street"
        houseNumbers:
          type: array
          items:
            $ref: "#/components/schemas/HouseNumber"

    APITokenInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: What the token is for, to recognise it later
          example: import script
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; must be in the future. Omit or null for no expiry.
          example: "2027-01-01T00:00:00Z"

    APIToken:
      type: object
      required: [id, name, prefix, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 5f0e6d0b-3c39-4a4e-9a55-0f3c8a1c2b7d
        name:
          type: string
          example: import script
        prefix:
          type: string
          description: The first characters of the secret, to tell tokens apart
          example: asv_Xk3v9QaZ
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Approximate (recorded at most once a minute)

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. Shown only in this response.
              example: asv_Xk3v9QaZ7m2b0VqYw1sN4eLr8tHcJpGdUfKiAoBxE5y

    UIConfig:
      type: object
      required: [oidc, version, commit, branch]
      properties:
        oidc:
          type: object
          required: [issuer, clientId, scope]
          properties:
            issuer:
              type: string
              example: https://auth.example.com/realms/example
            clientId:
              type: string
              example: address-serv
            scope:
              type: string
              example: openid profile email
        version:
          type: string
          example: v1.2.0
        commit:
          type: string
          example: 39e8906
        branch:
          type: string
          description: Git branch the build was made from; empty when unknown.
          example: main

    LocalizedText:
      description: A plain string, or an object mapping two-letter language codes to strings
      oneOf:
        - type: string
        - type: object
          additionalProperties:
            type: string
      example:
        en: Source URL
        de: Quell-URL

    CollectorSetting:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          example: source_url
        label:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        type:
          type: string
          enum: [string, secret, integer, number, boolean]
        required:
          type: boolean
        default:
          description: The value used when none is set; never present for secrets

    Collector:
      type: object
      required: [id, path, status, name, version, settingsSchema, settings, secretsSet, discoveredAt, updatedAt]
      properties:
        id:
          type: string
          example: bonn
        path:
          type: string
          example: /collectors/bonn
        status:
          type: string
          enum: [ok, invalid, missing]
        error:
          type: string
          description: Why an invalid collector was rejected
        name:
          type: string
          example: Bonn open data
        version:
          type: string
          example: 1.0.0
        description:
          $ref: "#/components/schemas/LocalizedText"
        settingsSchema:
          type: array
          items:
            $ref: "#/components/schemas/CollectorSetting"
        settings:
          type: object
          additionalProperties: true
          description: The values of the settings that are set, except secrets
        secretsSet:
          type: array
          items:
            type: string
          description: The keys of the secret settings that have a value
        discoveredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRun:
          $ref: "#/components/schemas/CollectorRun"

    EntityStats:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        adopted:
          type: integer
          description: Manual house numbers on the collector's streets that it took over
        deleted: { type: integer }
        released:
          type: integer
          description: Rows no longer returned that others depend on, turned into manual rows
        skipped:
          type: integer
          description: Output entries not applied because they were invalid, repeated or could not be placed
        conflicts:
          type: integer
          description: Output entries matching rows owned by others, which were left untouched

    SyncIssue:
      type: object
      required: [kind, entity, key, reason]
      properties:
        kind:
          type: string
          enum: [skipped, conflict, adopted, released]
        entity:
          type: string
          enum: [address, geoObject, street, houseNumber]
        index:
          type: integer
          description: The entry's position in the output's addresses or geoObjects
        key:
          type: string
          example: Adenauerallee 12a (Bonn-Zentrum, Bonn, DE)
        reason:
          type: string
        rowId:
          type: string
          format: uuid
          description: The stored row the issue is about

    CollectorRun:
      type: object
      required: [id, collectorId, status, triggeredBy, startedAt]
      properties:
        id:
          type: string
          format: uuid
        collectorId:
          type: string
          example: bonn
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        phase:
          type: string
          enum: [collecting, applying]
          description: Set while the run is running
        triggeredBy:
          type: string
          example: Ada Lovelace
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        exitCode:
          type: integer
        error:
          type: string
        stats:
          type: object
          properties:
            streets:
              $ref: "#/components/schemas/EntityStats"
            houseNumbers:
              $ref: "#/components/schemas/EntityStats"
            geoObjects:
              $ref: "#/components/schemas/EntityStats"
        issues:
          type: array
          description: The first 1000 issues of each kind; only returned for a single run
          items:
            $ref: "#/components/schemas/SyncIssue"
        log:
          type: string
          description: The tail of the collector's stderr; only returned for a single run

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: street not found
