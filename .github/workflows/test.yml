name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      # Scoped to ./cmd/... ./internal/... — the repo root also holds unrelated skill-asset
      # example code (agent/) that doesn't build as part of this module, so
      # ./... and `go mod tidy` can't be used here.
      - name: Build
        run: go build -o /dev/null ./cmd/... ./internal/...

      - name: Run tests
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
